<script id="logic">
/* ============================================================================
   PURE LOGIC — no DOM. Plain data in, plain data out, unit-testable.

   THE HARD PROBLEM THIS SOLVES: one CE activity can count toward several
   licences at once, and each licence has its own cycle, its own hour total and
   its own mandatory topics. A spreadsheet forces you to duplicate the row per
   licence and then keep the duplicates in step. Here a CE entry carries a LIST
   of licence ids, and every licence is totalled independently from the same
   source rows.
   ========================================================================== */

/* ---------------------------------------------------------------------------
   TOPIC LIBRARY AND PRESETS — STARTING POINTS ONLY. EDIT FREELY.
   Continuing-education requirements are set by each state board, differ by
   licence type, and change. Nothing below is a statement of any board's current
   rules. Confirm every figure with your own board.
   Last reviewed by the author: 2026-09-17.
   --------------------------------------------------------------------------- */
var CRITERIA_REVIEWED = "2026-09-17";

var TOPICS = [
  { id: "general",      label: "General / clinical practice" },
  { id: "pharmacology", label: "Pharmacology" },
  { id: "ethics",       label: "Ethics & professional boundaries" },
  { id: "painopioid",   label: "Pain management / opioids" },
  { id: "trafficking",  label: "Human trafficking awareness" },
  { id: "abuse",        label: "Child / elder abuse recognition" },
  { id: "infection",    label: "Infection control" },
  { id: "implicitbias", label: "Implicit bias" },
  { id: "suicide",      label: "Suicide prevention" },
  { id: "jurisprudence",label: "Jurisprudence / law & rules" },
  { id: "other",        label: "Other approved" }
];

var LICENCE_TYPES = ["RN", "LPN / LVN", "APRN", "Nurse Practitioner", "CNS", "CRNA", "CNM", "Other"];

/* Common shapes to start from. Hours and topics vary widely by state. */
var LICENCE_PRESETS = [
  { id: "p24_30", label: "24-month cycle, 30 hours", cycleMonths: 24, ceHours: 30 },
  { id: "p24_24", label: "24-month cycle, 24 hours", cycleMonths: 24, ceHours: 24 },
  { id: "p24_20", label: "24-month cycle, 20 hours", cycleMonths: 24, ceHours: 20 },
  { id: "p12_15", label: "12-month cycle, 15 hours", cycleMonths: 12, ceHours: 15 },
  { id: "custom", label: "Custom", cycleMonths: 24, ceHours: 30 }
];

/* ---------- helpers ---------- */
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function toISO(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseISO(s) {
  if (!s) return null;
  var p = String(s).split("-");
  if (p.length !== 3) return null;
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
function daysUntil(a, b) {
  var x = parseISO(a), y = parseISO(b);
  if (!x || !y) return null;
  return Math.round((y - x) / 86400000);
}
function addMonths(iso, months) {
  var d = parseISO(iso);
  if (!d) return null;
  var t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setMonth(t.getMonth() + months);
  return toISO(t);
}
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function round1(n) { return Math.round(n * 10) / 10; }
function pct(part, whole) { return whole > 0 ? (part / whole) * 100 : 0; }
function topicLabel(id) {
  for (var i = 0; i < TOPICS.length; i++) { if (TOPICS[i].id === id) return TOPICS[i].label; }
  return id || "";
}

/* ---------- the allocation engine ---------- */

/* Does this CE entry apply to this licence? */
function appliesTo(ceRow, licenceId) {
  var list = ceRow.licences;
  if (!list || !list.length) return false;
  for (var i = 0; i < list.length; i++) { if (list[i] === licenceId) return true; }
  return false;
}

/* The CE rows that count toward one licence's CURRENT cycle. */
function ceForLicence(ceRows, licence) {
  var start = licence.cycleStart;
  var end = addMonths(start, num(licence.cycleMonths));
  var out = [];
  for (var i = 0; i < ceRows.length; i++) {
    var r = ceRows[i];
    if (!appliesTo(r, licence.id)) continue;
    if (!r.date) continue;
    if (r.date >= start && r.date <= end) out.push(r);
  }
  return out;
}

/* Hours by topic for a set of CE rows. */
function hoursByTopic(ceRows) {
  var map = {};
  for (var i = 0; i < ceRows.length; i++) {
    var t = ceRows[i].topic || "other";
    map[t] = round1((map[t] || 0) + num(ceRows[i].hours));
  }
  return map;
}

/* THE PER-LICENCE STATUS — the core of the product. */
function licenceStatus(licence, ceRows, todayISOstr) {
  var rows = ceForLicence(ceRows, licence);
  var cycleEnd = addMonths(licence.cycleStart, num(licence.cycleMonths));

  var total = 0, unverified = 0;
  for (var i = 0; i < rows.length; i++) {
    total += num(rows[i].hours);
    if (rows[i].certificate !== "1") unverified += num(rows[i].hours);
  }
  total = round1(total);
  unverified = round1(unverified);

  var byTopic = hoursByTopic(rows);

  /* mandatory topic checks */
  var mandates = licence.mandates || [];
  var topicChecks = [];
  var mandatesMet = true;
  for (var m = 0; m < mandates.length; m++) {
    var have = byTopic[mandates[m].topic] || 0;
    var need = num(mandates[m].hours);
    var ok = have >= need;
    if (!ok) mandatesMet = false;
    topicChecks.push({ topic: mandates[m].topic, label: topicLabel(mandates[m].topic),
                       have: round1(have), need: need, ok: ok,
                       percent: need > 0 ? Math.min(100, pct(have, need)) : 100 });
  }

  var needHours = num(licence.ceHours);
  var remaining = Math.max(0, needHours - total);
  var daysLeft = daysUntil(todayISOstr, licence.expiry || cycleEnd);
  var monthsLeft = daysLeft === null ? null : daysLeft / 30.44;

  return {
    licenceId: licence.id,
    cycleStart: licence.cycleStart, cycleEnd: cycleEnd,
    expiry: licence.expiry || cycleEnd,
    logged: total, need: needHours, remaining: round1(remaining),
    unverified: unverified,
    entries: rows.length,
    byTopic: byTopic,
    topicChecks: topicChecks,
    hoursMet: total >= needHours,
    mandatesMet: mandatesMet,
    certificatesComplete: unverified === 0,
    daysLeft: daysLeft,
    expired: daysLeft !== null && daysLeft < 0,
    perMonthNeeded: monthsLeft && monthsLeft > 0 ? round1(remaining / monthsLeft) : null,
    percent: needHours > 0 ? Math.min(100, pct(total, needHours)) : 100,
    ready: total >= needHours && mandatesMet && unverified === 0
  };
}

/* How many hours did one CE entry earn across all the licences it was applied to?
   Useful for showing the leverage of a single course. */
function ceLeverage(ceRow) {
  var n = ceRow.licences ? ceRow.licences.length : 0;
  return { licences: n, effectiveHours: round1(num(ceRow.hours) * n) };
}

/* Total "credit delivered" vs "hours actually sat" — the multi-licence saving. */
function leverageSummary(ceRows) {
  var sat = 0, delivered = 0;
  for (var i = 0; i < ceRows.length; i++) {
    var h = num(ceRows[i].hours);
    sat += h;
    delivered += h * (ceRows[i].licences ? ceRows[i].licences.length : 0);
  }
  return { sat: round1(sat), delivered: round1(delivered),
           multiplier: sat > 0 ? Math.round((delivered / sat) * 100) / 100 : 0 };
}

/* Certifications (BLS, ACLS, specialty) — simple expiry tracking. */
function certStatus(cert, todayISOstr, warnDays) {
  var d = daysUntil(todayISOstr, cert.expiry);
  var w = warnDays === undefined ? 90 : warnDays;
  return {
    daysLeft: d,
    expired: d !== null && d < 0,
    expiringSoon: d !== null && d >= 0 && d <= w,
    state: d === null ? "unknown" : (d < 0 ? "expired" : (d <= w ? "soon" : "ok"))
  };
}

/* Everything with a date, sorted soonest first — licences and certifications together. */
function renewalCalendar(licences, certs, todayISOstr) {
  var items = [];
  for (var i = 0; i < licences.length; i++) {
    var L = licences[i];
    var exp = L.expiry || addMonths(L.cycleStart, num(L.cycleMonths));
    items.push({ kind: "licence", id: L.id, label: L.type + " — " + L.state,
                 detail: L.number || "", date: exp, daysLeft: daysUntil(todayISOstr, exp) });
  }
  for (var j = 0; j < certs.length; j++) {
    items.push({ kind: "certification", id: certs[j].id, label: certs[j].name,
                 detail: certs[j].issuer || "", date: certs[j].expiry,
                 daysLeft: daysUntil(todayISOstr, certs[j].expiry) });
  }
  items.sort(function (a, b) {
    if (a.date === b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date < b.date ? -1 : 1;
  });
  return items;
}

/* Shop-wide readiness across every licence. */
function overallReadiness(licences, ceRows, todayISOstr) {
  var ready = 0, statuses = [];
  for (var i = 0; i < licences.length; i++) {
    var s = licenceStatus(licences[i], ceRows, todayISOstr);
    statuses.push(s);
    if (s.ready) ready++;
  }
  return { statuses: statuses, ready: ready, total: licences.length,
           score: licences.length ? Math.round(pct(ready, licences.length)) : 0 };
}

function toCSV(rows) {
  var out = [];
  for (var i = 0; i < rows.length; i++) {
    var line = [];
    for (var j = 0; j < rows[i].length; j++) {
      var cell = rows[i][j] === null || rows[i][j] === undefined ? "" : String(rows[i][j]);
      line.push('"' + cell.replace(/"/g, '""') + '"');
    }
    out.push(line.join(","));
  }
  return out.join("\n");
}
</script>

<script id="uiapp">
/* ===== UI ===== */
var KEY = "llsNurseCE_v1";
/* ---- demo-only limit: this block exists only in the public try-it demo, never in the sold product ---- */
var DEMO_MODE = true, DEMO_CE_LIMIT = 25; /* 10 seeded + 15 room to try adding your own */
function demoLimitReached(){
  if(!DEMO_MODE) return false;
  if(!STATE.ce || STATE.ce.length < DEMO_CE_LIMIT) return false;
  alert("You've reached the "+DEMO_CE_LIMIT+"-entry demo limit.\n\nThis is just a preview — buy the full version for unlimited entries, all features unlocked, and your own permanent copy.");
  return true;
}

var STATE = null, VIEW = "dash", MODAL = null, EDIT = null, PACKLIC = null;

var TABS = [
  ["dash", "Dashboard"], ["licences", "Licences"], ["ce", "CE Log"],
  ["topics", "Requirements"], ["certs", "Certifications"], ["calendar", "Renewal Calendar"],
  ["pack", "Audit Pack"], ["reports", "Reports"]
];

function uid() { return "id" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function todayISO() { return toISO(new Date()); }

function blank() {
  return { profile: { name: "" }, licences: [], ce: [], certs: [], settings: { dark: "0" } };
}

function seed() {
  var today = new Date();
  var iso = function (mb, day) { return toISO(new Date(today.getFullYear(), today.getMonth() - mb, day)); };
  var fwd = function (mf, day) { return toISO(new Date(today.getFullYear(), today.getMonth() + mf, day)); };

  var l1 = uid(), l2 = uid(), l3 = uid();
  var licences = [
    { id: l1, type: "RN", state: "Texas", number: "RN-884213", compact: "1",
      cycleStart: iso(14, 1), cycleMonths: 24, ceHours: 20, expiry: fwd(10, 28),
      mandates: [ { topic: "jurisprudence", hours: 2 }, { topic: "painopioid", hours: 2 } ],
      notes: "Compact — primary state of residence" },
    { id: l2, type: "RN", state: "California", number: "RN-5512907", compact: "0",
      cycleStart: iso(10, 1), cycleMonths: 24, ceHours: 30, expiry: fwd(14, 15),
      mandates: [ { topic: "implicitbias", hours: 2 }, { topic: "abuse", hours: 1 } ],
      notes: "Single-state, travel assignments" },
    { id: l3, type: "Nurse Practitioner", state: "Texas", number: "AP-22104", compact: "0",
      cycleStart: iso(14, 1), cycleMonths: 24, ceHours: 20, expiry: fwd(10, 28),
      mandates: [ { topic: "pharmacology", hours: 5 } ],
      notes: "Prescriptive authority" }
  ];

  var ce = [];
  var addCE = function (mb, day, topic, hours, prov, cert, lics) {
    ce.push({ id: uid(), date: iso(mb, day), topic: topic, hours: hours,
              provider: prov, certificate: cert ? "1" : "0", licences: lics, notes: "" });
  };
  addCE(12, 9, "general", 6, "State nurses association conference", true, [l1, l2, l3]);
  addCE(11, 14, "jurisprudence", 2, "Texas nursing law & rules", true, [l1]);
  addCE(10, 5, "painopioid", 2, "Safe opioid prescribing", true, [l1, l3]);
  addCE(9, 22, "pharmacology", 5, "Advanced pharmacology update", true, [l3]);
  addCE(8, 11, "infection", 3, "Infection prevention refresher", true, [l1, l2]);
  addCE(6, 17, "general", 6, "Critical care skills intensive", true, [l1, l2]);
  addCE(5, 3, "abuse", 1, "Mandated reporter training", true, [l2]);
  addCE(4, 19, "ethics", 2, "Professional boundaries", true, [l1, l2]);
  addCE(2, 8, "general", 4, "Wound care certification course", true, [l2]);
  addCE(1, 26, "suicide", 2, "Suicide risk screening", false, [l2]);

  var certs = [
    { id: uid(), name: "BLS Provider", issuer: "American Heart Association",
      number: "BLS-772341", issued: iso(11, 3), expiry: fwd(12, 3), notes: "" },
    { id: uid(), name: "ACLS Provider", issuer: "American Heart Association",
      number: "ACLS-119820", issued: iso(20, 14), expiry: fwd(3, 14), notes: "Renew before travel contract" },
    { id: uid(), name: "CCRN", issuer: "AACN Certification Corporation",
      number: "CCRN-40921", issued: iso(30, 1), expiry: fwd(6, 1), notes: "Specialty certification" },
    { id: uid(), name: "PALS Provider", issuer: "American Heart Association",
      number: "PALS-66120", issued: iso(26, 9), expiry: iso(2, 9), notes: "Lapsed — needs rebooking" }
  ];

  return { profile: { name: "Sample Nurse" }, licences: licences, ce: ce, certs: certs,
           settings: { dark: "0" } };
}

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { STATE = JSON.parse(raw); }
  } catch (e) { STATE = null; }

function el(tag, attrs, html) {
  var a = "";
  if (attrs) {
    for (var k in attrs) {
      if (attrs[k] === null || attrs[k] === undefined || attrs[k] === "") continue;
      a += " " + k + '="' + String(attrs[k]).replace(/"/g, "&quot;") + '"';
    }
  }
  return "<" + tag + a + ">" + (html === undefined || html === null ? "" : html) + "</" + tag + ">";
}

function licenceById(id) {
  for (var i = 0; i < STATE.licences.length; i++) { if (STATE.licences[i].id === id) return STATE.licences[i]; }

function statusPill(s) {

  if (s.daysLeft !== null && s.daysLeft <= 90) return el("span", { "class": "pill bad" }, "Due soon, short");
  return el("span", { "class": "pill amber" }, "In progress");

function listCard(title, rows, rowFn, emptyMsg, headHtml) {
  var body;
  if (!rows.length) {

          el("button", { "class": "btn", "data-import": "1" }, "Restore backup") +
          el("button", { "class": "btn danger", "data-reset": "1" }, "Start empty")) +
        el("input", { type: "file", id: "importFile", accept: ".json", style: "display:none" }, "")));
}

/* ---------- MODALS ---------- */

function modalLicence() {
  var L = null;
  if (EDIT) { L = licenceById(EDIT); }
  L = L || { type: "RN", state: "", number: "", compact: "0", cycleStart: todayISO(),
             cycleMonths: 24, ceHours: 30, expiry: "", mandates: [], notes: "" };
  var popts = "";
  for (var i = 0; i < LICENCE_PRESETS.length; i++) {
    popts += el("option", { value: LICENCE_PRESETS[i].id }, esc(LICENCE_PRESETS[i].label));
  }
  return el("div", { "class": "sheet" },
    el("h3", {}, EDIT ? "Edit licence" : "Add licence") +
    el("div", { "class": "fgrid" },
      el("div", {}, el("label", {}, "Licence type") + el("select", { id: "lType" }, typeOptions(L.type))) +
      el("div", {}, el("label", {}, "State") + el("input", { id: "lState", value: esc(L.state) }, "")) +
      el("div", {}, el("label", {}, "Licence number") + el("input", { id: "lNumber", value: esc(L.number || "") }, "")) +
      el("div", {}, el("label", {}, "Compact licence?") +
        el("select", { id: "lCompact" },
          el("option", { value: "0", selected: L.compact !== "1" ? "selected" : null }, "No") +
          el("option", { value: "1", selected: L.compact === "1" ? "selected" : null }, "Yes"))) +
      el("div", { style: "grid-column:1/-1" }, el("label", {}, "Quick preset") +
        el("select", { id: "lPreset" }, popts)) +
      el("div", {}, el("label", {}, "Cycle start") + el("input", { id: "lCycleStart", type: "date", value: esc(L.cycleStart) }, "")) +
      el("div", {}, el("label", {}, "Cycle length (months)") + el("input", { id: "lCycleMonths", type: "number", min: "1", value: esc(L.cycleMonths) }, "")) +
      el("div", {}, el("label", {}, "CE hours required") + el("input", { id: "lCeHours", type: "number", min: "0", step: "0.5", value: esc(L.ceHours) }, "")) +
      el("div", {}, el("label", {}, "Licence expires") + el("input", { id: "lExpiry", type: "date", value: esc(L.expiry || "") }, "")) +
      el("div", { style: "grid-column:1/-1" }, el("label", {}, "Notes") + el("textarea", { id: "lNotes" }, esc(L.notes || "")))) +
    el("p", { "class": "hint", style: "margin-top:10px" },
      "The preset only fills cycle length and hours. Correct both against your board, then set " +
      "mandatory topics on the Requirements tab.") +
    el("div", { "class": "row", style: "margin-top:8px;justify-content:flex-end" },
      el("button", { "class": "btn", "data-close": "1" }, "Cancel") +
      el("button", { "class": "btn", "data-apply-lpreset": "1" }, "Fill from preset") +
      el("button", { "class": "btn pri", "data-save-l": "1" }, "Save")));
}

function modalCE() {
  var r = null;
  if (EDIT) { for (var i = 0; i < STATE.ce.length; i++) { if (STATE.ce[i].id === EDIT) r = STATE.ce[i]; } }
  r = r || { date: todayISO(), topic: "general", hours: "", provider: "", certificate: "0",
             licences: [], notes: "" };
  var checks = "";
  for (var j = 0; j < STATE.licences.length; j++) {
    var L = STATE.licences[j];
    var on = false;
    var list = r.licences || [];
    for (var k = 0; k < list.length; k++) { if (list[k] === L.id) on = true; }
    checks += el("label", { "class": "checkrow" },
      el("input", { type: "checkbox", "data-lic-check": L.id, checked: on ? "checked" : null }, "") +
      el("span", {}, esc(L.type + " — " + L.state) +
        (L.number ? " (" + esc(L.number) + ")" : "")));
  }
  if (!STATE.licences.length) {
    checks = el("p", { "class": "hint" }, "Add a licence first, then CE can be assigned to it.");
  }
  return el("div", { "class": "sheet" },
    el("h3", {}, EDIT ? "Edit CE entry" : "Add CE entry") +
    el("div", { "class": "fgrid" },
      el("div", {}, el("label", {}, "Date") + el("input", { id: "eDate", type: "date", value: esc(r.date) }, "")) +
      el("div", {}, el("label", {}, "Hours") + el("input", { id: "eHours", type: "number", step: "0.25", min: "0", value: esc(r.hours) }, "")) +
      el("div", {}, el("label", {}, "Topic") + el("select", { id: "eTopic" }, topicOptions(r.topic))) +
      el("div", {}, el("label", {}, "Certificate on file?") +
        el("select", { id: "eCert" },
          el("option", { value: "0", selected: r.certificate !== "1" ? "selected" : null }, "No") +
          el("option", { value: "1", selected: r.certificate === "1" ? "selected" : null }, "Yes"))) +
      el("div", { style: "grid-column:1/-1" }, el("label", {}, "Provider") + el("input", { id: "eProv", value: esc(r.provider || "") }, "")) +
      el("div", { style: "grid-column:1/-1" }, el("label", {}, "Notes") + el("textarea", { id: "eNotes" }, esc(r.notes || "")))) +
    el("div", { style: "margin-top:12px" },
      el("label", {}, "Counts toward which licences?") + checks) +
    el("div", { "class": "row", style: "margin-top:12px;justify-content:flex-end" },
      el("button", { "class": "btn", "data-close": "1" }, "Cancel") +
      el("button", { "class": "btn pri", "data-save-e": "1" }, "Save")));
}

function modalCert() {
  var c = null;
  if (EDIT) { for (var i = 0; i < STATE.certs.length; i++) { if (STATE.certs[i].id === EDIT) c = STATE.certs[i]; } }
  c = c || { name: "", issuer: "", number: "", issued: todayISO(), expiry: "", notes: "" };
  return el("div", { "class": "sheet" },
    el("h3", {}, EDIT ? "Edit certification" : "Add certification") +
    el("div", { "class": "fgrid" },
      el("div", { style: "grid-column:1/-1" }, el("label", {}, "Name") + el("input", { id: "tName", value: esc(c.name) }, "")) +
      el("div", {}, el("label", {}, "Issuer") + el("input", { id: "tIssuer", value: esc(c.issuer || "") }, "")) +
      el("div", {}, el("label", {}, "Number") + el("input", { id: "tNumber", value: esc(c.number || "") }, "")) +
      el("div", {}, el("label", {}, "Issued") + el("input", { id: "tIssued", type: "date", value: esc(c.issued || "") }, "")) +
      el("div", {}, el("label", {}, "Expires") + el("input", { id: "tExpiry", type: "date", value: esc(c.expiry || "") }, "")) +
      el("div", { style: "grid-column:1/-1" }, el("label", {}, "Notes") + el("textarea", { id: "tNotes" }, esc(c.notes || "")))) +
    el("div", { "class": "row", style: "margin-top:14px;justify-content:flex-end" },
      el("button", { "class": "btn", "data-close": "1" }, "Cancel") +
      el("button", { "class": "btn pri", "data-save-t": "1" }, "Save")));
}

/* ---------- RENDER ---------- */

function render() {
  var tabs = "";
  for (var i = 0; i < TABS.length; i++) {
    tabs += el("button", { "class": "tab" + (VIEW === TABS[i][0] ? " on" : ""), "data-tab": TABS[i][0] }, TABS[i][1]);
  }
  document.getElementById("tabs").innerHTML = tabs;

  var html = "";
  if (VIEW === "dash") html = viewDash();
  else if (VIEW === "licences") html = viewLicences();
  else if (VIEW === "ce") html = viewCE();
  else if (VIEW === "topics") html = viewTopics();
  else if (VIEW === "certs") html = viewCerts();
  else if (VIEW === "calendar") html = viewCalendar();
  else if (VIEW === "pack") html = viewPack();
  else if (VIEW === "reports") html = viewReports();

  if (MODAL === "licence") html += el("div", { "class": "modal", "data-modal": "1" }, modalLicence());
  else if (MODAL === "ce") html += el("div", { "class": "modal", "data-modal": "1" }, modalCE());
  else if (MODAL === "cert") html += el("div", { "class": "modal", "data-modal": "1" }, modalCert());

  document.getElementById("app").innerHTML = html;
}

function val(id) { var n = document.getElementById(id); return n ? n.value : ""; }

function download(name, text, type) {
  var blob = new Blob([text], { type: type || "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

document.addEventListener("click", function (ev) {
  var t = ev.target;
  var g = function (attr) {
    var n = t;
    while (n && n !== document) {
      if (n.getAttribute && n.getAttribute(attr) !== null) return n.getAttribute(attr);
      n = n.parentNode;
    }
    return null;
  };

  if (g("data-tab")) { VIEW = g("data-tab"); MODAL = null; EDIT = null; render(); return; }
  if (g("data-dark")) {
    STATE.settings.dark = STATE.settings.dark === "1" ? "0" : "1";
    document.documentElement.setAttribute("data-dark", STATE.settings.dark);
    save(); render(); return;
  }
  if (g("data-close") || (g("data-modal") && t.className === "modal")) { MODAL = null; EDIT = null; render(); return; }
  if (g("data-print")) { window.print(); return; }

  /* licences */
  if (g("data-new-l")) { MODAL = "licence"; EDIT = null; render(); return; }
  if (g("data-edit-l")) { MODAL = "licence"; EDIT = g("data-edit-l"); render(); return; }
  if (g("data-del-l")) {
    var idl = g("data-del-l");
    if (confirm("Delete this licence? CE entries stay but lose this assignment.")) {
      STATE.licences = STATE.licences.filter(function (x) { return x.id !== idl; });
      for (var i = 0; i < STATE.ce.length; i++) {
        STATE.ce[i].licences = (STATE.ce[i].licences || []).filter(function (x) { return x !== idl; });
      }
      save(); render();
    }
    return;
  }
  if (g("data-apply-lpreset")) {
    var pid = val("lPreset");
    for (var p = 0; p < LICENCE_PRESETS.length; p++) {
      if (LICENCE_PRESETS[p].id === pid) {
        var cm = document.getElementById("lCycleMonths");
        var ch = document.getElementById("lCeHours");
        if (cm) cm.value = LICENCE_PRESETS[p].cycleMonths;
        if (ch) ch.value = LICENCE_PRESETS[p].ceHours;
      }
    }
    return;
  }
  if (g("data-save-l")) {
    var st = val("lState").trim();
    if (!st) { alert("Which state issued this licence?"); return; }
    var existing = EDIT ? licenceById(EDIT) : null;
    var lrec = {
      id: EDIT || uid(), type: val("lType"), state: st, number: val("lNumber"),
      compact: val("lCompact"), cycleStart: val("lCycleStart") || todayISO(),
      cycleMonths: num(val("lCycleMonths")) || 24, ceHours: num(val("lCeHours")),
      expiry: val("lExpiry"), mandates: existing ? (existing.mandates || []) : [],
      notes: val("lNotes")
    };
    if (EDIT) { STATE.licences = STATE.licences.map(function (x) { return x.id === EDIT ? lrec : x; }); }
    else { STATE.licences.push(lrec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  /* mandatory topics */
  if (g("data-add-m")) {
    var lid = g("data-add-m");
    var L = licenceById(lid);
    if (!L) return;
    var topic = val("mt_" + lid);
    var hours = num(val("mh_" + lid));
    if (hours <= 0) { alert("How many hours are required for that topic?"); return; }
    if (!L.mandates) L.mandates = [];
    L.mandates.push({ topic: topic, hours: hours });
    save(); render(); return;
  }
  if (g("data-del-m")) {
    var parts = g("data-del-m").split("|");
    var L2 = licenceById(parts[0]);
    if (L2 && L2.mandates) { L2.mandates.splice(Number(parts[1]), 1); save(); render(); }
    return;
  }

  /* CE */
  if (g("data-new-e")) { MODAL = "ce"; EDIT = null; render(); return; }
  if (g("data-edit-e")) { MODAL = "ce"; EDIT = g("data-edit-e"); render(); return; }
  if (g("data-del-e")) {
    var ide = g("data-del-e");
    if (confirm("Delete this CE entry?")) {
      STATE.ce = STATE.ce.filter(function (x) { return x.id !== ide; });
      save(); render();
    }
    return;
  }
  if (g("data-save-e")) {
    var eh = num(val("eHours"));
    if (eh <= 0) { alert("Enter the CE hours."); return; }
    var boxes = document.querySelectorAll("[data-lic-check]");
    var lics = [];
    for (var b = 0; b < boxes.length; b++) {
      if (boxes[b].checked) lics.push(boxes[b].getAttribute("data-lic-check"));
    }
    if (!lics.length && STATE.licences.length) {
      if (!confirm("This entry is not assigned to any licence, so it will not count anywhere. Save anyway?")) return;
    }
    var erec = { id: EDIT || uid(), date: val("eDate") || todayISO(), topic: val("eTopic"),
                 hours: eh, provider: val("eProv"), certificate: val("eCert"),
                 licences: lics, notes: val("eNotes") };
    if (EDIT) { STATE.ce = STATE.ce.map(function (x) { return x.id === EDIT ? erec : x; }); }
    else { if(demoLimitReached()) return; STATE.ce.push(erec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  /* certifications */
  if (g("data-new-t")) { MODAL = "cert"; EDIT = null; render(); return; }
  if (g("data-edit-t")) { MODAL = "cert"; EDIT = g("data-edit-t"); render(); return; }
  if (g("data-del-t")) {
    var idt = g("data-del-t");
    if (confirm("Delete this certification?")) {
      STATE.certs = STATE.certs.filter(function (x) { return x.id !== idt; });
      save(); render();
    }
    return;
  }
  if (g("data-save-t")) {
    var nm = val("tName").trim();
    if (!nm) { alert("Give the certification a name."); return; }
    var trec = { id: EDIT || uid(), name: nm, issuer: val("tIssuer"), number: val("tNumber"),
                 issued: val("tIssued"), expiry: val("tExpiry"), notes: val("tNotes") };
    if (EDIT) { STATE.certs = STATE.certs.map(function (x) { return x.id === EDIT ? trec : x; }); }
    else { STATE.certs.push(trec); }
    MODAL = null; EDIT = null; save(); render(); return;
  }

  /* reports */
  if (g("data-export-json")) {
    download("nurse-ce-backup-" + todayISO() + ".json", JSON.stringify(STATE, null, 2));
    return;
  }
  if (g("data-export-csv")) {
    var rows = [["Date", "Topic", "Hours", "Provider", "Certificate on file", "Counts toward", "Notes"]];
    var cs = STATE.ce.slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); });
    for (var i2 = 0; i2 < cs.length; i2++) {
      var names = [];
      var ll = cs[i2].licences || [];
      for (var j2 = 0; j2 < ll.length; j2++) names.push(licenceLabel(ll[j2]));
      rows.push([cs[i2].date, topicLabel(cs[i2].topic), cs[i2].hours, cs[i2].provider || "",
        cs[i2].certificate === "1" ? "Yes" : "No", names.join(" / "), cs[i2].notes || ""]);
    }
    download("ce-log-" + todayISO() + ".csv", toCSV(rows), "text/csv");
    return;
  }
  if (g("data-reset")) {
    if (confirm("Clear everything and start empty? Export a backup first if you need one.")) {
      STATE = blank(); save(); VIEW = "dash"; render();
    }
    return;
  }
  if (g("data-import")) {
    var f = document.getElementById("importFile");
    if (f) f.click();
    return;
  }
});

document.addEventListener("change", function (ev) {
  var t = ev.target;
  if (t && t.getAttribute && t.getAttribute("data-pack-lic") !== null) {
    PACKLIC = t.value; render(); return;
  }
  if (t && t.id === "importFile" && t.files && t.files[0]) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var obj = JSON.parse(e.target.result);
        if (!obj || !obj.licences) throw new Error("bad file");
        STATE = obj;
        if (!STATE.settings) STATE.settings = { dark: "0" };
        if (!STATE.ce) STATE.ce = [];
        if (!STATE.certs) STATE.certs = [];
        if (!STATE.profile) STATE.profile = { name: "" };
        save(); render();
      } catch (err) { alert("That file could not be read as a backup."); }
    };
    reader.readAsText(t.files[0]);
  }
});

load();
render();
</script>
</body></html>
